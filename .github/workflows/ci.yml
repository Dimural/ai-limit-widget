name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Runs first and on its own: if an invariant has been broken, that is the
      # thing to fix, and a compile error should not hide it.
      - name: Safety invariants
        run: ./scripts/check-safety.sh

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Proves the app and widget bundles still assemble and sign, which the
      # unit tests cannot tell us.
      - name: Assemble app bundle
        run: ./scripts/build-app.sh
